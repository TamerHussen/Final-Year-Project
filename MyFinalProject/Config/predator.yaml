behaviors:
  Predator:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 81920
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5

    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 2
      memory:
        memory_size: 256
        sequence_length: 64

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 1500000
    time_horizon: 256
    summary_freq: 5000
